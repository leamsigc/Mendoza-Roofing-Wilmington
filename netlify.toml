[build]
  command = "pnpm build && node scripts/generate-redirects.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SEO duplicate-intent consolidation (2026-10-07 GSC audit).
# The [...slug].vue runtime also 301s these, but explicit edge rules win
# even for prerendered shells. Survivor pages keep the equity.
# 1. Short inspection slug -> canonical keyword-explicit survivor
[[redirects]]
  from = "/free-inspection"
  to = "/free-roof-inspection-wilmington-nc"
  status = 301
  force = true

# 2. Weaker Shallotte blog -> better-performing survivor (GSC pos 11.8)
[[redirects]]
  from = "/blog/roofing-contractor-shallotte-nc"
  to = "/blog/roofing-company-shallotte-nc"
  status = 301
  force = true

# 3. Stray Spanish slugs at root (source files deleted) -> /es/ canonicals
[[redirects]]
  from = "/costo-reemplazo-de-techo-wilmington-nc"
  to = "/es/costo-reemplazo-de-techo-wilmington-nc"
  status = 301
  force = true

